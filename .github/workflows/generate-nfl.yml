name: generate-nfl

# Runs the NFL producer (model-only game-line predictions from the P1/P2 assets
# + live ESPN schedule). Daily 12:00 UTC (~7-8am ET): NFL plays Thu/Sun/Mon (and
# the odd Sat), and a game must be visible in predictions_current on its own game
# day, so a daily refresh keeps the current day's slate present regardless of
# GitHub cron flakiness. generate_nfl.py is idempotent (upsert on game keys), so
# there is NO exact-hour/day gate here -- GitHub cron is UTC-only and best-effort
# (firings are routinely delayed), and a duplicate or slightly-late run just
# re-upserts the same rows. Manual runs (workflow_dispatch) proceed the same way.
on:
  schedule:
    - cron: "0 12 * * *"    # daily 12:00 UTC (~7-8am ET)
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python + sync deps
        run: uv sync

      - name: Generate NFL predictions (model-only game lines)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SM_DATA_DIR: ${{ github.workspace }}/data
        run: uv run python scripts/generate_nfl.py
