name: build-trends
# Daily betting trends in season months (Jan-Feb, Aug-Dec), ahead of the desk
# (desk-auto-* 22:15 UTC): Action
# Network season betting records (NFL + CFB) and NFL situational trends.
on:
  schedule:
    - cron: "30 20 * 1,2,8-12 *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trends:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Sync deps
        run: uv sync
      - name: Capture Action Network team betting records
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: uv run python scripts/capture_team_records.py
      - name: Build NFL situational trends
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/build_nfl_trends.py
