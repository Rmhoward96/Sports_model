name: build-cfb-priors

# Manual ingest of CFB preseason priors from collegefootballdata.com, committed as
# assets/cfb/priors.parquet. Dispatch with a `seasons` range (default 2015 2026: history
# for the backtest/gate plus the live season). CFBD_API_KEY is a repo secret; the key is
# never printed. Early seasons tolerate endpoints with no data (fields stay NaN); the
# current season and portal 2021+ fail the run on any error/empty response.
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Inclusive season range: START END"
        required: false
        default: "2015 2026"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Sync deps
        run: uv sync
      - name: Build CFB preseason priors
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          SEASONS: ${{ inputs.seasons || '2015 2026' }}
        run: uv run python scripts/build_cfb_priors.py --seasons $SEASONS
      - name: Commit priors asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/cfb/priors.parquet
          git diff --staged --quiet || git commit -m "data(cfb): preseason priors from CFBD (build-cfb-priors)"
          git push
