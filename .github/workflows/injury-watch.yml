name: injury-watch

# Twice-daily injury watch -- re-runs the model/sim pipeline when a game
# kicking off within 30h has an Out/Doubtful designation change (Questionable
# churn never triggers). Scheduled at 3 PM and 10 PM UTC to catch injury
# announcements across US time zones.
#
# Injury sources: NFL = nflverse's weekly report verified per player against
# ESPN's live list (sportsmodel.nfl.injury_report); CFB = SportsDataIO.
#
# For each sport (NFL, CFB):
#  1. `injury_watch.py --check` compares against `injury_snapshots`.
#  2. If changed, the full re-run chain: model -> sim (NFL only) -> +EV board
#     -> +EV parlays -> record the snapshot (`--record`, which re-fetches from
#     the same injury source `--check` reads).
# The LLM Decision Desk is retired (ML-only NFL): no desk bundle / synthesis /
# write steps. Each job keeps its concurrency group (injury-pipeline-<sport>).
#
# Requires repo secrets: DATABASE_URL, SPORTSDATA_API_KEY.
# Optional repo variable SIM_ML_MODE (off | shadow | live; unset = off) turns on
# props-ML serving in the NFL sim step; the models are downloaded (only when it
# is not off) from the props-ml-latest Release -> nfl-sim-ml-v1 and props-ml-v2
# -> nfl-sim-ml-v2 (train-props-ml.yml); the sim serves the version
# nfl_sim_serving names.
# Optional repo variable ML_GAME_LINES (on | off; unset = off): when on, the ML
# sim (generate_sim_nfl.py) is the NFL game-line source, so the Elo
# generate_nfl.py step is skipped (its newer rows would win predictions_current).
on:
  schedule:
    - cron: "0 15,22 * * *"  # 3 PM and 10 PM UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nfl:
    runs-on: ubuntu-latest
    timeout-minutes: 60    # the props-ML path (shadow/live) rebuilds the feature tables
    env:
      SPORT: nfl
      SIM_ML_MODE: ${{ vars.SIM_ML_MODE || 'off' }}
      ML_GAME_LINES: ${{ vars.ML_GAME_LINES || 'off' }}
    concurrency:
      group: injury-pipeline-nfl
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Sync deps
        run: uv sync

      - name: Check for injury changes
        id: check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SPORTSDATA_API_KEY: ${{ secrets.SPORTSDATA_API_KEY }}
        run: uv run python scripts/injury_watch.py --sport "$SPORT" --check

      - name: Generate NFL predictions (model-only game lines)
        if: steps.check.outputs.changed == 'true' && env.ML_GAME_LINES != 'on'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SM_DATA_DIR: ${{ github.workspace }}/data
        run: uv run python scripts/generate_nfl.py

      - name: Download props-ML models (props-ml-latest -> nfl-sim-ml-v1, props-ml-v2 -> nfl-sim-ml-v2)
        if: steps.check.outputs.changed == 'true' && env.SIM_ML_MODE != 'off'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One models dir per served version -- the NFL sim step serves the
          # version nfl_sim_serving names: Release props-ml-latest ->
          # data/props_ml/models/nfl-sim-ml-v1 (unchanged release), props-ml-v2 ->
          # data/props_ml/models/nfl-sim-ml-v2. Each set is verified against its
          # own MANIFEST.sha256 (uploaded last by train-props-ml.yml); a missing
          # Release or any verification failure removes THAT version's dir with a
          # ::warning:: (the sim takes its "no artifacts" ML failure path only if
          # that version is served). A missing props-ml-v2 Release is only a
          # ::notice:: (expected until v2 ships; the step cannot read the served
          # version): if the site serves nfl-sim-ml-v2 the sim step then fails
          # its ML path with a ::warning::props-ml: (artifacts missing). Never
          # fails the step.
          fetch_verified() {
            rel="$1"
            dir="data/props_ml/models/$2"
            missing="${3:-warning}"
            rm -rf "$dir"
            if ! gh release download "$rel" -D "$dir" --clobber; then
              rm -rf "$dir"
              echo "::$missing::props-ml: no $rel release; $2 disabled"
              return 0
            fi
            reason=""
            if [ ! -f "$dir/MANIFEST.sha256" ]; then
              reason="MANIFEST.sha256 missing"
            elif ! (cd "$dir" && sha256sum -c --strict --quiet MANIFEST.sha256); then
              reason="checksum mismatch or missing file"
            else
              listed=" $(sed -E 's/^[0-9a-f]{64} [ *]//' "$dir/MANIFEST.sha256" | tr '\n' ' ')"
              for f in "$dir"/*; do
                n="$(basename "$f")"
                [ "$n" = MANIFEST.sha256 ] && continue
                case "$listed" in
                  *" $n "*) ;;
                  *) reason="$n not in MANIFEST.sha256"; break ;;
                esac
              done
            fi
            if [ -n "$reason" ]; then
              rm -rf "$dir"
              echo "::warning::props-ml: release verification failed ($rel: $reason); $2 models removed"
            else
              echo "props-ml release verified ($rel -> $dir)"
            fi
          }
          fetch_verified props-ml-latest nfl-sim-ml-v1
          fetch_verified props-ml-v2 nfl-sim-ml-v2 notice

      - name: Generate NFL sim predictions (Monte Carlo + player distributions)
        if: steps.check.outputs.changed == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SM_DATA_DIR: ${{ github.workspace }}/data
        run: uv run python scripts/generate_sim_nfl.py

      - name: Rebuild +EV board
        if: steps.check.outputs.changed == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/build_ev_board.py --sport "$SPORT"

      - name: Build +EV parlays
        if: steps.check.outputs.changed == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/build_best_parlays.py

      - name: Record injury snapshot
        if: steps.check.outputs.changed == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SPORTSDATA_API_KEY: ${{ secrets.SPORTSDATA_API_KEY }}
        run: uv run python scripts/injury_watch.py --sport "$SPORT" --record

  cfb:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SPORT: cfb
    concurrency:
      group: injury-pipeline-cfb
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Sync deps
        run: uv sync

      - name: Check for injury changes
        id: check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SPORTSDATA_API_KEY: ${{ secrets.SPORTSDATA_API_KEY }}
        run: uv run python scripts/injury_watch.py --sport "$SPORT" --check

      - name: Generate CFB predictions (model-only game lines)
        if: steps.check.outputs.changed == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SM_DATA_DIR: ${{ github.workspace }}/data
        run: uv run python scripts/generate_cfb.py

      - name: Rebuild +EV board
        if: steps.check.outputs.changed == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/build_ev_board.py --sport "$SPORT"

      - name: Build +EV parlays
        if: steps.check.outputs.changed == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/build_best_parlays.py

      - name: Record injury snapshot
        if: steps.check.outputs.changed == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SPORTSDATA_API_KEY: ${{ secrets.SPORTSDATA_API_KEY }}
        run: uv run python scripts/injury_watch.py --sport "$SPORT" --record
