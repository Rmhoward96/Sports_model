name: grade-ev

# Forward-grade the +EV board: for each finished game, grade every surfaced
# pick against the result AND the Pinnacle closing line (CLV) -> ev_results.
# This is the honest scoreboard -- the board only earns trust once this record
# is positive. grade_ev.py loops both sports (FINAL_PROVIDERS) internally.
# DATABASE_URL lives here, not in the session.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Grade finished games within this many days"
        type: string
        default: "7"
  schedule:
    # Daily, 13:20 UTC (~8am ET / 7am CT) -- after even a late West-coast
    # game the prior evening is final. The grader is idempotent (only touches
    # finished, ungraded games), so a daily run just picks up each slate the
    # morning after it finishes instead of waiting until Tuesday.
    - cron: "20 13 * * *"

permissions:
  contents: read

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Sync deps
        run: uv sync
      - name: Grade +EV picks (forward CLV)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/grade_ev.py --days "${{ github.event.inputs.days || '7' }}"
