name: grade-predictions

# Prediction-ACCURACY grading (did the predicted winner win? how close was the
# margin/total?) for NFL + CFB. No odds, no CLV, no ROI — this is the prediction
# tool's track record. grade_predictions.py reads ESPN finals + Supabase only
# (free), is idempotent, and grades both sports in one pass, so it runs often.
on:
  schedule:
    - cron: "0 */6 * * *"   # every 6h - a finished game gets graded within hours
  workflow_dispatch:
    inputs:
      regrade:
        description: "Re-grade already-graded games (backfill new columns onto recent games)"
        type: boolean
        default: false
      days:
        description: "Rolling window in days"
        type: string
        default: "7"

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python + sync deps
        run: uv sync

      - name: Grade predictions (accuracy)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          uv run python scripts/grade_predictions.py \
            --days "${{ github.event.inputs.days || '7' }}" \
            ${{ github.event.inputs.regrade == 'true' && '--regrade' || '' }}
