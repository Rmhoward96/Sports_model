name: refresh-props

# Confirm-late half of the props flow. The morning daily-ingest run generates props
# from PROJECTED lineups; these afternoon/evening runs re-generate them as CONFIRMED
# lineups post (a few hours before first pitch), overwriting the projected rows in
# place (upsert keyed on game/player/market). Games are staggered, so we run a few
# times to catch lineups as they drop. Times are UTC (no DST adjustment needed here —
# these just need to fall across the afternoon/evening ET window).
on:
  schedule:
    # GitHub cron is UTC-only. Baseball season is entirely US Daylight Time
    # (Central = UTC-5), so these map to 11 AM / 2 PM / 5 PM Central in-season.
    - cron: "0 16 * * *"   # 11 AM Central
    - cron: "0 19 * * *"   # 2 PM Central
    - cron: "0 22 * * *"   # 5 PM Central
  workflow_dispatch: {}

jobs:
  props:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Sync deps
        run: uv sync
      - name: Regenerate predictions (confirmed lineups, Monte Carlo sim)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SM_DATA_DIR: ${{ github.workspace }}/data
        run: uv run python scripts/generate_sim.py
