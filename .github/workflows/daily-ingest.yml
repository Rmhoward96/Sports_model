name: daily-ingest

# Target: 08:30 America/Chicago year-round. GitHub cron is UTC-only and does not
# follow DST, so we fire at BOTH 13:30 UTC (= 08:30 CDT, summer) and 14:30 UTC
# (= 08:30 CST, winter); the `gate` job lets only the one that is actually 08:30
# in Chicago proceed. Manual runs (workflow_dispatch) always proceed.
on:
  schedule:
    - cron: "30 13 * * *"   # 08:30 Central during Daylight Time (UTC-5)
    - cron: "30 14 * * *"   # 08:30 Central during Standard Time (UTC-6)
  workflow_dispatch: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"          # manual runs always go
          elif [ "$(TZ=America/Chicago date +%H)" = "08" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"          # it's the 08:xx Central firing
          else
            echo "run=false" >> "$GITHUB_OUTPUT"         # the off-season duplicate; skip
          fi

  ingest:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python + sync deps
        run: uv sync

      - name: Daily MLB ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}   # optional; unset => local-only
          SM_DATA_DIR: ${{ github.workspace }}/data
        run: uv run python scripts/daily_ingest.py
