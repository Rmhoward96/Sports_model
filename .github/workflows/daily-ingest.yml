name: daily-ingest

# Target: refresh the slate + probable pitchers each morning Central. GitHub cron is
# UTC-only AND best-effort (firings are routinely delayed 10-60 min), so we fire at
# BOTH 13:30 UTC (~08:30 CDT) and 14:30 UTC (~08:30 CST). daily_ingest.py and
# generate_sim.py are both idempotent (upsert on keys), so running on BOTH firings is
# harmless and makes the morning refresh robust to a delayed cron. (A previous
# exact-hour gate — run only when Central hour == "08" — silently skipped any firing
# that GitHub delayed past 09:00 Central, which left the slate/probables stale and
# froze predictions/board; removed.) Manual runs (workflow_dispatch) also proceed.
on:
  schedule:
    - cron: "30 13 * * *"   # 08:30 Central during Daylight Time (UTC-5)
    - cron: "30 14 * * *"   # 08:30 Central during Standard Time (UTC-6)
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python + sync deps
        run: uv sync

      - name: Daily MLB ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}   # optional; unset => local-only
          SM_DATA_DIR: ${{ github.workspace }}/data
        run: uv run python scripts/daily_ingest.py

      - name: Generate predictions (Monte Carlo sim)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SM_DATA_DIR: ${{ github.workspace }}/data
        run: uv run python scripts/generate_sim.py
