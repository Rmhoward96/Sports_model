name: generate-cfb

# CFB game-prediction producer (model-only forecasts from the CFB Elo/SRS/points
# ratings + live ESPN schedule). Predictions, not bets. generate_cfb.py is
# idempotent (upsert on game keys), so — like generate-nfl — there is NO exact-hour
# gate; GitHub cron is best-effort and a slightly-late or duplicate run just
# re-upserts the same rows.
on:
  schedule:
    # Daily 12:00 UTC (~7-8am ET). CFB plays Thu-Sat (plus the odd weekday game),
    # and ESPN adds/reschedules games midweek, so a Tue+Sat cadence left the
    # Thursday/Friday slate unpredicted until Saturday -- after some had kicked
    # off. Daily is cheap (ESPN-only, ~20s, idempotent upsert) and guarantees the
    # current day's games are always present.
    - cron: "0 12 * * *"
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python + sync deps
        run: uv sync

      - name: Generate CFB predictions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SM_DATA_DIR: ${{ github.workspace }}/data
        run: uv run python scripts/generate_cfb.py
