name: generate-sim-nfl

# Runs the NFL sim producer (Monte Carlo game simulations + player-level
# distributions). Wed/Sat/Sun 21:00 UTC (Thu/Sun/Mon slates), plus daily
# 13:30 UTC while ML_GAME_LINES is on (see below). generate_sim_nfl.py is
# idempotent (upsert on game keys), so duplicate or slightly-late runs just
# re-upsert the same rows. Manual runs (workflow_dispatch) proceed the same
# way. The job shares injury-watch's NFL concurrency group
# (injury-pipeline-nfl, never cancelled in progress): both write the ML slate
# and game_predictions, so they run one at a time.
#
# Props-ML serving: the repo variable SIM_ML_MODE (off | shadow | live; unset =
# off) is passed to generate_sim_nfl.py. When it is not off, the latest models
# are downloaded from the props-ml-latest Release (train-props-ml.yml) first; a
# missing Release only prints a note and the script applies its shadow/live
# failure semantics. With SIM_ML_MODE off nothing is downloaded and the run is
# exactly the current sim.
#
# ML-only NFL: the repo variable ML_GAME_LINES (on | off; unset = off) makes
# the ML sim the NFL game-line source -- with nfl_sim_serving on nfl-sim-ml-v1,
# generate_sim_nfl.py then also writes game_predictions (nfl-sim-ml-v1) and
# takes the slate from ESPN's target week too. Off = exactly today's run.
# With generate-nfl disabled, the daily 13:30 UTC run is what advances the
# slate to the new week (ESPN's target week turns once the last game is final;
# after Tuesday's 12:00 refresh-nfl-snapshots commit, before TNF) and refreshes
# kickoffs / market lines. It runs only while ML_GAME_LINES is on: off keeps
# the Wed/Sat/Sun schedule (generate-nfl still writes the lines daily).
# Game-lines-only rollback: set ML_GAME_LINES=off, `gh workflow enable
# generate-nfl`, then dispatch generate-nfl (its rows win only once newer).
on:
  schedule:
    - cron: "0 21 * * 0,3,6"  # Wed/Sat/Sun 21:00 UTC (~4-5pm ET)
    - cron: "30 13 * * *"     # daily 13:30 UTC, only while ML_GAME_LINES is on (job `if`)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  generate:
    # the daily cron is for ML_GAME_LINES=on only (`==` is case-insensitive in
    # Actions expressions); the Wed/Sat/Sun cron and dispatches always run
    if: github.event.schedule != '30 13 * * *' || vars.ML_GAME_LINES == 'on'
    runs-on: ubuntu-latest
    concurrency:
      group: injury-pipeline-nfl
      cancel-in-progress: false
    timeout-minutes: 35    # the ML path (shadow/live) rebuilds the feature tables
    env:
      SIM_ML_MODE: ${{ vars.SIM_ML_MODE || 'off' }}
      ML_GAME_LINES: ${{ vars.ML_GAME_LINES || 'off' }}
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python + sync deps
        run: uv sync

      - name: Download props-ML models (Release props-ml-latest)
        if: env.SIM_ML_MODE != 'off'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download props-ml-latest -D data/props_ml/models --clobber || echo "no props-ml release"
          # Verify the set against MANIFEST.sha256 (uploaded last by train-props-ml.yml);
          # on any failure remove the models so the sim takes its "no artifacts"
          # ML failure path (current sim still written). Never fails the step.
          if [ -d data/props_ml/models ]; then
            reason=""
            if [ ! -f data/props_ml/models/MANIFEST.sha256 ]; then
              reason="MANIFEST.sha256 missing"
            elif ! (cd data/props_ml/models && sha256sum -c --strict --quiet MANIFEST.sha256); then
              reason="checksum mismatch or missing file"
            else
              listed=" $(sed -E 's/^[0-9a-f]{64} [ *]//' data/props_ml/models/MANIFEST.sha256 | tr '\n' ' ')"
              for f in data/props_ml/models/*; do
                n="$(basename "$f")"
                [ "$n" = MANIFEST.sha256 ] && continue
                case "$listed" in
                  *" $n "*) ;;
                  *) reason="$n not in MANIFEST.sha256"; break ;;
                esac
              done
            fi
            if [ -n "$reason" ]; then
              rm -rf data/props_ml/models
              echo "::warning::props-ml: release verification failed ($reason); models removed"
            else
              echo "props-ml release verified"
            fi
          fi

      - name: Generate NFL sim predictions (Monte Carlo + player distributions)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SM_DATA_DIR: ${{ github.workspace }}/data
        run: uv run python scripts/generate_sim_nfl.py
