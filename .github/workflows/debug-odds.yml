name: debug-odds

# One-off, manual-only: dumps the raw The Odds API player-prop response to the log
# so we can see what the API returns under batter_hits vs what we store. No DB writes.
on:
  workflow_dispatch:
    inputs:
      player:
        description: "Player name substring to filter (blank = show all)"
        required: false
        default: ""
      events:
        description: "How many upcoming events to sample"
        required: false
        default: "3"

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Sync deps
        run: uv sync
      - name: Dump raw odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: uv run python scripts/debug_odds.py "${{ github.event.inputs.player }}" "${{ github.event.inputs.events }}"
