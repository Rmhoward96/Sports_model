name: capture-betting-splits

# Snapshot NFL + CFB public betting splits (cash%/ticket%) near close into
# nfl_betting_splits / cfb_betting_splits -- the game pages' Public Betting
# section (and NFL cover-ensemble market features). DORMANT by default: the
# script is a no-op unless the `INGEST_SPLITS` repo variable is "true" (and the
# APIFY_TOKEN secret is set for the Action Network actor). capture_betting_splits
# captures both sports by default (SPORTS var overrides). Splits are meaningful
# post-lineup, so the cadence mirrors capture-odds' near-close windows;
# idempotent per (game_pk, market, side, captured_at).
on:
  schedule:
    - cron: "0 16 * * 0,1,4,6"
    - cron: "0 20 * * 0,1,4,6"
    - cron: "0 23 * * 0,1,4,6"   # near close for late-afternoon/primetime kicks
  workflow_dispatch:
    inputs:
      window_min:
        description: "Override SPLIT_WINDOW_MIN for this run (minutes before kickoff; widen to smoke-test the actor when no game is near close)"
        required: false
        default: ""
      season:
        description: "Smoke test only: actor season (e.g. 2026). Pulls a specific week's scheduled slate."
        required: false
        default: ""
      week:
        description: "Smoke test only: actor week (e.g. 4). Requires season."
        required: false
        default: ""
      debug:
        description: "Smoke test only: set to 1 to dump the first raw actor item to the log."
        required: false
        default: ""
      status:
        description: "Smoke test only: actor gameStatus (scheduled|inprogress|complete). Default scheduled."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  splits:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Sync deps
        run: uv sync
      - name: Capture NFL betting splits (dormant unless INGEST_SPLITS=true)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          INGEST_SPLITS: ${{ vars.INGEST_SPLITS }}
          SPLIT_WINDOW_MIN: ${{ github.event.inputs.window_min || vars.SPLIT_WINDOW_MIN }}
          AN_SEASON: ${{ github.event.inputs.season }}
          AN_WEEK: ${{ github.event.inputs.week }}
          AN_DEBUG: ${{ github.event.inputs.debug }}
          AN_STATUS: ${{ github.event.inputs.status }}
          SM_DATA_DIR: ${{ github.workspace }}/data
        run: uv run python scripts/capture_betting_splits.py
