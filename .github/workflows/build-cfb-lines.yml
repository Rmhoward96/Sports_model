name: build-cfb-lines

# One-time (manual) pull of historical CFB betting lines from collegefootballdata.com,
# committed as assets/cfb/lines.parquet for the P2 game-line backtest. CFBD_API_KEY is a
# repo secret; the key is never printed. Dispatch this once after adding the secret.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Sync deps
        run: uv sync
      - name: Pull CFB historical lines
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: uv run python scripts/build_cfb_lines.py
      - name: Commit lines asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/cfb/lines.parquet
          git diff --staged --quiet || git commit -m "data(cfb): historical betting lines from CFBD (build-cfb-lines)"
          git push
