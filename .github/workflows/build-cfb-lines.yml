name: build-cfb-lines

# Manual pull of historical CFB betting lines (openers, closes, moneylines) from
# collegefootballdata.com, committed as assets/cfb/lines.parquet to the dispatched ref.
# CFBD_API_KEY is a repo secret; the key is never printed.
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Space-separated seasons to pull"
        required: false
        default: "2015 2016 2017 2018 2019 2020 2021 2022 2023 2024 2025"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Sync deps
        run: uv sync
      - name: Pull CFB historical lines
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          SEASONS: ${{ inputs.seasons }}
        run: uv run python scripts/build_cfb_lines.py --seasons ${SEASONS:-2015 2016 2017 2018 2019 2020 2021 2022 2023 2024 2025}
      - name: Commit lines asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/cfb/lines.parquet
          git diff --staged --quiet || git commit -m "data(cfb): CFBD openers, closes and moneylines (build-cfb-lines)"
          git push
