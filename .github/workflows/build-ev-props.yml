name: build-ev-props

# Build the player-prop +EV board (NFL and MLB) -> ev_prop_picks / ev_prop_picks_current.
# (MLB: the latest prop_predictions for upcoming games, markets total_bases / pitcher_ks /
# hits_allowed / outs_recorded, Platt-calibrated P(over) vs the posted line; run 7 min
# after each of capture-odds' MLB-only crons. MLB prop picks stay straight bets -- they
# are not parlay legs.)
#
# NFL:
# Joins nfl_player_sim_current (the sim's per-player prop distributions) to the
# latest player-prop odds in odds_snapshot, computes P(over) at the book line +
# no-vig market prob + EV, and writes one +EV row per projected-featured
# (player, market, line). NFL only. DATABASE_URL lives here, not in the session.
#
# Run AFTER capture-odds' post-lineup prop windows (so prop lines are fresh) and
# after generate-sim-nfl (so the sim distributions exist). The prop board is
# assistive -- not a proven edge until grade-ev-props' forward CLV record
# supports it (calibration was shown walk-forward; edge is a CLV question).
#
# PREREQ: db/migration_ev_prop_picks.sql must be run in Supabase, and NFL
# player-prop capture must be enabled in capture-odds (PROP_WINDOW_MIN / the
# prop markets in SportConfig["nfl"]).
on:
  workflow_dispatch:
    inputs:
      lines_only:
        description: "Write nfl_prop_lines only (skip the +EV board)"
        type: boolean
        default: false
  schedule:
    # A little after the capture-odds post-lineup windows on game days
    # (Sun/Mon/Thu/Sat), mirroring build-ev-board. Crons are UTC.
    - cron: "35 20 * * 0,1,4,6"
    - cron: "35 23 * * 0,1,4,6"
    # Lines-only refresh for early (1pm/4pm ET) kickoffs: without this, their
    # graded line would freeze at the 15:35 UTC daily pull, up to 5h stale by
    # kickoff.
    - cron: "35 16,18 * * 0,1,4,6"
    # Daily lines-only run: writes nfl_prop_lines for every sim projection
    # with a line (no usage gate, no +EV filter), independent of the +EV
    # board's game-day schedule above.
    - cron: "35 15 * * *"
    # MLB: 7 min after capture-odds' MLB-only crons (props are captured in the window just
    # before first pitch, so each run re-prices the games about to start).
    - cron: "37 16 * 3-11 *"
    - cron: "7 19 * 3-11 *"
    - cron: "37 21 * 3-11 *"
    - cron: "7 0 * 3-11 *"

permissions:
  contents: read

env:
  # True on the MLB crons above: build only the MLB prop board. False otherwise.
  MLB_FIRING: ${{ (github.event.schedule == '37 16 * 3-11 *' || github.event.schedule == '7 19 * 3-11 *' || github.event.schedule == '37 21 * 3-11 *' || github.event.schedule == '7 0 * 3-11 *') && 'true' || 'false' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Sync deps
        run: uv sync
      - name: Build NFL prop +EV board
        if: ${{ env.MLB_FIRING != 'true' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/build_ev_props_board.py --sport nfl ${{ (github.event.schedule == '35 15 * * *' || github.event.schedule == '35 16,18 * * 0,1,4,6' || github.event.inputs.lines_only == 'true') && '--lines-only' || '' }}
      - name: Build MLB prop +EV board
        if: ${{ env.MLB_FIRING == 'true' || github.event_name == 'workflow_dispatch' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/build_ev_props_board.py --sport mlb ${{ github.event.inputs.lines_only == 'true' && '--lines-only' || '' }}
      - name: Build +EV parlays
        if: ${{ env.MLB_FIRING != 'true' && !(github.event.schedule == '35 15 * * *' || github.event.schedule == '35 16,18 * * 0,1,4,6' || github.event.inputs.lines_only == 'true') }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/build_best_parlays.py
