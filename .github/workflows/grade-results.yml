name: grade-results

# Grades predictions against closing lines + actual results into prediction_results.
# Runs over a rolling window so games get graded once they finalize. Idempotent, and
# costs ZERO Odds API credits (reads only MLB StatsAPI + the DB), so we run it every
# 3h — a finished game gets its CLV within ~3h instead of waiting up to ~18h for a
# twice-daily pass. Covers day games (finish ~evening UTC) and night/west-coast games
# (finish ~03:00-06:00 UTC) alike.
on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours (00,03,06,09,12,15,18,21 UTC)
  workflow_dispatch: {}

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Sync deps
        run: uv sync
      # MLB leg removed 2026-08-30 (MLB scrapped — focus NFL). Open MLB picks stay pending;
      # re-add this step to resume MLB grading.
      - name: Grade results (NFL)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/grade_results.py --sport nfl
