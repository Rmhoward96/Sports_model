name: desk-inputs

# On-demand: assemble the CFB decision-desk input bundle (model output + recent
# form + SportsDataIO injuries/news + the ESPN pick-time line) and upload it as
# an artifact. The three desk agents run in a Claude Code session over this
# bundle (see docs/decision-desk-runbook.md); this workflow only does the
# secret-bearing data pull (SPORTSDATA_API_KEY + DATABASE_URL live here, not in
# the session). Download the artifact with:  gh run download <run-id> -n desk-bundle
on:
  workflow_dispatch:
    inputs:
      days_ahead:
        description: "Only include games within this many days of now"
        type: string
        default: "7"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python + sync deps
        run: uv sync

      - name: Assemble desk bundle
        env:
          SPORTSDATA_API_KEY: ${{ secrets.SPORTSDATA_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/desk_inputs.py --out desk_bundle.json --days-ahead "${{ github.event.inputs.days_ahead || '7' }}"

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: desk-bundle
          path: desk_bundle.json
          if-no-files-found: error
