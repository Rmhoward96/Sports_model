name: write-desk-picks

# On-demand: validate + log the decision-desk picks the in-session agents
# produced (committed to a JSON file in the repo). write_desk_picks.py is
# fail-closed (writes nothing if validation fails) and only writes pre-kickoff
# picks. DATABASE_URL lives here, not in the session. See
# docs/decision-desk-runbook.md.
on:
  workflow_dispatch:
    inputs:
      picks_path:
        description: "Path to the committed picks JSON (produced in-session)"
        type: string
        default: "assets/desk/picks_current.json"

permissions:
  contents: read

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python + sync deps
        run: uv sync

      - name: Write desk picks
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/write_desk_picks.py --in "${{ github.event.inputs.picks_path }}"
