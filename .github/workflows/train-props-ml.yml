name: train-props-ml

# Weekly props-ML retrain + Release publish (docs/superpowers/plans/
# 2026-09-25-nfl-props-ml-p2.md, Task 11).
#
# train job (every Tuesday, after Monday Night Football), one matrix leg per
# served props-ML version (fail-fast off: a v2 failure never blocks v1):
#   nfl-sim-ml-v1: pipeline.json / calibration.json / a_gate.json, published to
#                  props-ml-latest (previous set: props-ml-prev) -- unchanged;
#   nfl-sim-ml-v2: pipeline_v2.json / calibration_v2.json / a_gate_v2.json
#                  (fit_props_ml_final.py --gate-name _v2), published to
#                  props-ml-v2 (previous set: props-ml-v2-prev).
# Per leg ($GATE_NAME, $RELEASE, $PREV_RELEASE, $MODELS_DIR from the matrix):
#  0. guards (each prints a ::notice:: and skips the rest -- the job still
#     succeeds): no committed assets/nfl/props_ml/pipeline$GATE_NAME.json with
#     final_pass == true (a failed B gate is never fit or published; v2 is
#     skipped until its pipeline is committed); v2 only: no committed
#     assets/nfl/props_ml/v2_gate.json with pass == true (pipeline_v2's
#     final_pass is v2 vs the current sim; v2_gate is v2 vs v1), or no
#     `serving` block (H, k) in assets/nfl/props_ml/qb_profile_params.json (the
#     v2 build needs it); and, after the feature build, no labelled week after
#     the published (in $RELEASE) props_ml_config.json's trained_through (no
#     release -> proceed);
#  1. rebuild the feature tables from nflverse (data/props_ml/*.parquet) with
#     --qb-params $QB_PARAMS (v1 gate, v2 serving: v2 trains on the QB params
#     it is served with; its fit refuses tables built otherwise);
#  2. QUICK GATE -- fit_props_ml_final.py --holdout-weeks 2 scores the pipeline
#     vs the current sim on the last 2 completed weeks after pipeline.json's
#     data_end and EXITS 1 ON FAILURE. The step's exit code is the gate (never
#     quick_gate.json: a stale file can survive an input-load failure); a
#     failure stops the leg, so nothing below runs and nothing is published;
#  3. final fit on every completed game -> data/props_ml/models/<version>/
#     (v2 needs the `serving` block of qb_profile_params.json: refused without);
#  4. publish: the current $RELEASE assets are copied into $PREV_RELEASE
#     (deleted + recreated: one-step rollback), then the new models are
#     uploaded to $RELEASE with --clobber (created with --latest=false when
#     missing; stale assets no longer produced are removed) and
#     MANIFEST.sha256 (sha256 of every model file) is uploaded LAST. A failure
#     mid-upload restores the saved previous assets and fails the leg.
# A full_ladder dispatch skips this job (it never publishes).
# Serving (generate-sim-nfl.yml, injury-watch.yml) downloads props-ml-latest ->
# models/nfl-sim-ml-v1 and props-ml-v2 -> models/nfl-sim-ml-v2 only when the
# repo variable SIM_ML_MODE is shadow/live, and serves the version
# nfl_sim_serving names.
#
# recheck job (runs beside train; never publishes, never commits; outputs go
# to a run artifact):
#  * first Tuesday of the month (scheduled run, day-of-month <= 7): the
#    fixed-configuration A re-check -- scripts/train_props_ml.py with
#    PROPS_ML_TOGGLES = the kept toggles in assets/nfl/props_ml/a_gate.json and
#    PROPS_ML_SEASONS = the previous 2 completed seasons + the current one;
#  * workflow_dispatch with full_ladder=true: the full offline B / blend /
#    calibration ladder (scripts/train_props_ml_b.py) instead. Its outputs
#    (b_gate / pipeline / calibration json, report, OOF parquet) are uploaded
#    for review; committing them is a manual decision.
#
# Rollback: UPDATE nfl_sim_serving SET model_version = 'sim-nfl-v1' first; then
# (optionally) set SIM_ML_MODE=off. (With the site serving nfl-sim-ml-v1,
# SIM_ML_MODE=off alone keeps serving the ML version -- filled with the
# current sim's rows.) v2 -> v1: UPDATE nfl_sim_serving SET model_version =
# 'nfl-sim-ml-v1', then dispatch generate-sim-nfl (refreshes the v1 slate). To
# roll back only the models: `gh release download props-ml-prev` (v2:
# props-ml-v2-prev) and re-upload to props-ml-latest (props-ml-v2).
on:
  schedule:
    - cron: "0 14 * * 2"   # Tuesdays 14:00 UTC
  workflow_dispatch:
    inputs:
      full_ladder:
        description: "Run the full B/blend/calibration ladder (train_props_ml_b.py) instead of the monthly re-check"
        type: boolean
        default: false

permissions:
  contents: write          # create / upload the per-version model Releases (+ their -prev sets)

concurrency:
  group: props-ml-train
  cancel-in-progress: false

jobs:
  train:
    # a full_ladder dispatch runs only the ladder: it must never publish
    if: ${{ !inputs.full_ladder }}
    name: train (${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: nfl-sim-ml-v1
            gate_name: ""
            qb_params: gate
            release: props-ml-latest
            prev_release: props-ml-prev
          - version: nfl-sim-ml-v2
            gate_name: _v2
            qb_params: serving
            release: props-ml-v2
            prev_release: props-ml-v2-prev
    env:
      MODEL_VERSION: ${{ matrix.version }}
      GATE_NAME: ${{ matrix.gate_name }}
      QB_PARAMS: ${{ matrix.qb_params }}
      RELEASE: ${{ matrix.release }}
      PREV_RELEASE: ${{ matrix.prev_release }}
      MODELS_DIR: data/props_ml/models/${{ matrix.version }}
    steps:
      - uses: actions/checkout@v5

      # Guard 1 (first): only a committed pipeline$GATE_NAME.json whose
      # final_pass is a JSON true may be retrained / published; the v2 leg
      # also needs a committed v2_gate.json whose pass is a JSON true (v2 vs
      # v1) and, as it builds with --qb-params serving, a `serving` block in
      # qb_profile_params.json. Otherwise skip with a ::notice:: (the leg
      # succeeds).
      - name: Guard (a passing pipeline.json)
        id: guard
        run: |
          skip() {
            echo "$1"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          f="assets/nfl/props_ml/pipeline${GATE_NAME}.json"
          if ! { [ -f "$f" ] && [ "$(jq -r '.final_pass == true' "$f" 2>/dev/null || true)" = "true" ]; }; then
            skip "::notice::props-ml: no passing pipeline.json — skipping retrain ($f, $MODEL_VERSION)"
          fi
          if [ "$GATE_NAME" = "_v2" ]; then
            g="assets/nfl/props_ml/v2_gate.json"
            if ! { [ -f "$g" ] && [ "$(jq -r '.pass == true' "$g" 2>/dev/null || true)" = "true" ]; }; then
              skip "::notice::props-ml: no passing v2_gate.json (v2 vs v1) — skipping retrain ($g, $MODEL_VERSION)"
            fi
          fi
          if [ "$QB_PARAMS" = "serving" ]; then
            q="assets/nfl/props_ml/qb_profile_params.json"
            if ! { [ -f "$q" ] && [ "$(jq -r '(.serving.H | type) == "number" and (.serving.k | type) == "number"' "$q" 2>/dev/null || true)" = "true" ]; }; then
              skip "::notice::props-ml: no serving block in $q — skipping retrain ($MODEL_VERSION; run tune_qb_profile.py --mode serving)"
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Install uv
        if: steps.guard.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v10.0.1

      - name: Sync deps
        if: steps.guard.outputs.skip != 'true'
        run: uv sync

      # v1: gate QB params (as always); v2: the serving QB params it is served
      # with (Ruling S1) -- fit_props_ml_final.py --gate-name _v2 refuses tables
      # whose recorded (H, k) differ from the serving block.
      - name: Build props-ML feature tables (nflverse)
        if: steps.guard.outputs.skip != 'true'
        run: uv run python scripts/build_player_features.py --qb-params "$QB_PARAMS"

      # Guard 2: nothing new to learn from -> skip. Compares the rebuilt feature
      # table's labelled weeks with the PUBLISHED config's trained_through; no
      # $RELEASE release (or no config asset) -> proceed.
      - name: Guard (a labelled week after the published trained_through)
        id: fresh
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/props-ml-published"
          rm -rf "$d"
          mkdir -p "$d"
          if gh release download "$RELEASE" -p props_ml_config.json -D "$d" >/dev/null 2>&1 \
              && [ -f "$d/props_ml_config.json" ]; then
            res="$(uv run python scripts/fit_props_ml_final.py --check-new-weeks "$d/props_ml_config.json" | tail -n 1)"
            if [ "$res" = "new_weeks=false" ]; then
              echo "::notice::props-ml: no labelled week after the published trained_through — skipping retrain"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            echo "no published props_ml_config.json (no $RELEASE release): retraining"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Quick gate (last 2 completed weeks; exit 1 blocks the fit and publish)
        id: quick_gate
        if: steps.guard.outputs.skip != 'true' && steps.fresh.outputs.skip != 'true'
        run: uv run python scripts/fit_props_ml_final.py --holdout-weeks 2 --gate-name "$GATE_NAME"

      - name: Final fit (data/props_ml/models/<version>)
        if: steps.guard.outputs.skip != 'true' && steps.fresh.outputs.skip != 'true'
        run: uv run python scripts/fit_props_ml_final.py --gate-name "$GATE_NAME"

      # Only the guards' `if:` (no status function, so success() is implied):
      # runs only when every step above succeeded and neither guard skipped.
      # Order: rotate prev -> upload models -> drop stale assets -> upload
      # MANIFEST.sha256 LAST. Serving verifies the downloaded set against the
      # manifest, so a half-published (mixed) set is rejected, never loaded.
      # Any failure once the upload phase starts restores the saved previous
      # assets into $RELEASE (ERR trap) and fails the leg.
      - name: Publish models (${{ matrix.release }}; previous assets -> ${{ matrix.prev_release }})
        if: steps.guard.outputs.skip != 'true' && steps.fresh.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          models="$MODELS_DIR"
          files=()
          names=()
          for f in "$models"/*; do
            [ -f "$f" ] && [ "$(basename "$f")" != MANIFEST.sha256 ] || continue
            files+=("$f")
            names+=("$(basename "$f")")
          done
          if [ "${#files[@]}" -eq 0 ] || [ ! -f "$models/props_ml_config.json" ]; then
            echo "::error::no model artifacts in $models"
            exit 1
          fi
          manifest_dir="$RUNNER_TEMP/props-ml-manifest"
          rm -rf "$manifest_dir"
          mkdir -p "$manifest_dir"
          (cd "$models" && sha256sum "${names[@]}") > "$manifest_dir/MANIFEST.sha256"

          prev_dir="$RUNNER_TEMP/$PREV_RELEASE"
          rm -rf "$prev_dir"
          if gh release view "$RELEASE" >/dev/null 2>&1; then
            if gh release download "$RELEASE" -D "$prev_dir"; then
              gh release delete "$PREV_RELEASE" -y --cleanup-tag || true
              gh release create "$PREV_RELEASE" "$prev_dir"/* --latest=false --target "$GITHUB_SHA" \
                --title "props-ml models $MODEL_VERSION (previous)" \
                --notes "$RELEASE assets as of run $GITHUB_RUN_ID, kept for one-step rollback."
            else
              rm -rf "$prev_dir"
              echo "::warning::could not download the current $RELEASE assets; $PREV_RELEASE left as is"
            fi
          else
            gh release create "$RELEASE" --latest=false --target "$GITHUB_SHA" \
              --title "props-ml models $MODEL_VERSION" \
              --notes "Weekly props-ML $MODEL_VERSION models (train-props-ml.yml). Previous set: $PREV_RELEASE."
          fi

          restore_latest() {
            trap - ERR
            set +e
            echo "::error::props-ml publish failed during upload; restoring the previous $RELEASE assets"
            prev=()
            keep_prev=" "
            if [ -d "$prev_dir" ]; then
              for f in "$prev_dir"/*; do
                [ -f "$f" ] || continue
                prev+=("$f")
                keep_prev="$keep_prev$(basename "$f") "
              done
            fi
            if [ "${#prev[@]}" -eq 0 ]; then
              echo "::error::no previous assets to restore; $RELEASE has no matching MANIFEST.sha256, so serving rejects it"
              exit 1
            fi
            gh release upload "$RELEASE" "${prev[@]}" --clobber
            for name in $(gh release view "$RELEASE" --json assets --jq '.assets[].name'); do
              case "$keep_prev" in
                *" $name "*) ;;
                *) gh release delete-asset "$RELEASE" "$name" -y ;;
              esac
            done
            exit 1
          }
          trap restore_latest ERR

          gh release upload "$RELEASE" "${files[@]}" --clobber

          # drop assets the new fit no longer produces (e.g. a b_<market> model);
          # the old MANIFEST.sha256 stays until the new one clobbers it
          keep=" MANIFEST.sha256 ${names[*]} "
          assets="$(gh release view "$RELEASE" --json assets --jq '.assets[].name')"
          for name in $assets; do
            case "$keep" in
              *" $name "*) ;;
              *) gh release delete-asset "$RELEASE" "$name" -y ;;
            esac
          done

          gh release upload "$RELEASE" "$manifest_dir/MANIFEST.sha256" --clobber
          trap - ERR
          echo "published ${#files[@]} files + MANIFEST.sha256 to $RELEASE ($MODEL_VERSION)"

  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 350     # the full B ladder is long; hosted runners cap jobs at 360
    permissions:
      contents: read         # re-check / ladder never publish or commit
    steps:
      # mode: recheck (scheduled first Tuesday) | ladder (dispatch full_ladder) | none.
      # seasons: previous 2 completed + current, where "current" is this year's
      # season from October on (the first Tuesday of September is always before
      # kickoff) and last year's season otherwise (Jan-Feb playoffs / offseason).
      - name: Plan (first Tuesday re-check / full ladder / nothing)
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          FULL_LADDER: ${{ inputs.full_ladder }}
        run: |
          day=$((10#$(date -u +%d)))
          month=$((10#$(date -u +%m)))
          year=$((10#$(date -u +%Y)))
          mode=none
          if [ "$EVENT" = "schedule" ] && [ "$day" -le 7 ]; then
            mode=recheck
          fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$FULL_LADDER" = "true" ]; then
            mode=ladder
          fi
          if [ "$month" -ge 10 ]; then current=$year; else current=$((year - 1)); fi
          seasons="$((current - 2)),$((current - 1)),$current"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "seasons=$seasons" >> "$GITHUB_OUTPUT"
          echo "props-ml recheck plan: mode=$mode seasons=$seasons"

      - uses: actions/checkout@v5
        if: steps.plan.outputs.mode != 'none'

      - name: Install uv
        if: steps.plan.outputs.mode != 'none'
        uses: astral-sh/setup-uv@v10.0.1

      - name: Sync deps
        if: steps.plan.outputs.mode != 'none'
        run: uv sync

      - name: Build props-ML feature tables (nflverse)
        id: build
        if: steps.plan.outputs.mode != 'none'
        run: |
          uv run python scripts/build_player_features.py
          touch "$RUNNER_TEMP/props-ml-run.start"

      - name: Monthly fixed-config re-check (kept A toggles, 2 completed seasons + current)
        if: steps.plan.outputs.mode == 'recheck'
        env:
          PROPS_ML_SEASONS: ${{ steps.plan.outputs.seasons }}
        run: |
          PROPS_ML_TOGGLES="$(jq -r '(.kept // []) | join(",")' assets/nfl/props_ml/a_gate.json)"
          if [ -z "$PROPS_ML_TOGGLES" ]; then
            echo "::error::assets/nfl/props_ml/a_gate.json has no kept toggles: nothing to re-check"
            exit 1
          fi
          export PROPS_ML_TOGGLES
          echo "PROPS_ML_TOGGLES=$PROPS_ML_TOGGLES PROPS_ML_SEASONS=$PROPS_ML_SEASONS"
          uv run python scripts/train_props_ml.py

      - name: Full B / blend / calibration ladder (dispatch full_ladder)
        if: steps.plan.outputs.mode == 'ladder'
        run: uv run python scripts/train_props_ml_b.py

      - name: Collect outputs
        if: steps.plan.outputs.mode != 'none' && !cancelled() && steps.build.outcome == 'success'
        run: |
          out="$RUNNER_TEMP/props-ml-${{ steps.plan.outputs.mode }}"
          mkdir -p "$out"
          find assets/nfl/props_ml docs/superpowers/reports data/props_ml -maxdepth 1 -type f \
            -newer "$RUNNER_TEMP/props-ml-run.start" \
            \( -name '*.json' -o -name '*.md' -o -name 'oof_*.parquet' \) \
            -exec cp {} "$out"/ \;
          ls -la "$out"
          echo "dir=$out" >> "$GITHUB_OUTPUT"
        id: collect

      - name: Upload re-check / ladder outputs
        if: steps.plan.outputs.mode != 'none' && !cancelled() && steps.collect.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: props-ml-${{ steps.plan.outputs.mode }}-${{ github.run_id }}
          path: ${{ steps.collect.outputs.dir }}
          if-no-files-found: error
