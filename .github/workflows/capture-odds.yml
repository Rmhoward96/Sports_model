name: capture-odds

# Snapshot NFL + CFB game-line odds (moneyline/spread/total) from The Odds API,
# INCLUDING Pinnacle (an EU bookmaker -- the ingester pulls regions=us,eu). The
# last snapshot before a game's commence_time is its closing line, used for the
# +EV engine's CLV grading, so we run several times across game days and let each
# run capture the whole slate (one cheap bulk call per sport). No player props.
#
# scripts/ingest_odds.py loops NFL + CFB internally and writes to odds_snapshot;
# one sport failing does not abort the other. Crons are UTC; NFL plays Thu/Sun/Mon,
# CFB mostly Sat. Cadence is tunable -- widen it once CLV grading (sub-project 6)
# says where the closing snapshots need to land.
on:
  schedule:
    - cron: "0 16 * * 0,1,4,6"   # ~pre-kick window (Sun/Mon/Thu/Sat)
    - cron: "0 18 * * 0,1,4,6"
    - cron: "0 20 * * 0,1,4,6"
    - cron: "0 23 * * 0,1,4,6"   # ~near close for late-afternoon/primetime kicks
  workflow_dispatch:

permissions:
  contents: read

jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Sync deps
        run: uv sync
      - name: Snapshot odds (NFL + CFB game lines)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: uv run python scripts/ingest_odds.py
